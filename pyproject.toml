[project]
name = "pacman"
version = "0.1.0"
description = "Add your description here"   # TODO add a desc
readme = "README.md"
authors = [
    { name = "ErjieIsHeree", email = "erjieisheree@gmail.com" },
    { name = "", email = "" }  # TODO add parteners name
]
requires-python = ">=3.14"
dependencies = [
    "mazegenerator",
    "mlx",
]

[project.scripts]
pacman = "pacman:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
mazegenerator = { path = "src/modules/mazegenerator-2.1.0-py3-none-any.whl" }
mlx = { path = "src/modules/mlx/ubuntu/mlx-2.2-py3-none-any.whl" }

[tool.mypy]
mypy_path = "typings"
